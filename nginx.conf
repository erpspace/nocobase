# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/staging.app.erpspace.pl/before/*;

log_format apm '"$time_local" client=$remote_addr '
               'method=$request_method request="$request" '
               'request_length=$request_length '
               'status=$status bytes_sent=$bytes_sent '
               'body_bytes_sent=$body_bytes_sent '
               'referer=$http_referer '
               'user_agent="$http_user_agent" '
               'upstream_addr=$upstream_addr '
               'upstream_status=$upstream_status '
               'request_time=$request_time '
               'upstream_response_time=$upstream_response_time '
               'upstream_connect_time=$upstream_connect_time '
               'upstream_header_time=$upstream_header_time';
               
server {
    http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.app.erpspace.pl;
    server_tokens off;
    root /home/forge/staging.app.erpspace.pl;
    
    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/staging.app.erpspace.pl/2848647/server.crt;
    ssl_certificate_key /etc/nginx/ssl/staging.app.erpspace.pl/2848647/server.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;
    
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    index index.html index.htm;
    charset utf-8;
    
    # FORGE CONFIG (DO NOT REMOVE!)
    include forge-conf/staging.app.erpspace.pl/server/*;

    client_max_body_size 1000M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /storage/uploads/ {
        alias /home/forge/staging.app.erpspace.pl/storage/uploads/;
        add_header Cache-Control "public";
        access_log off;
        autoindex off;
    }

    location /static/plugins/ {
        alias /home/forge/staging.app.erpspace.pl/packages/plugins/;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires 0;
        etag off;
        access_log off;
        autoindex off;

        location ~ ^/static/plugins/@([^/]+)/([^/]+)/dist/client/(.*)$ {
            allow all;
        }

        location ~ ^/static/plugins/([^/]+)/dist/client/(.*)$ {
            allow all;
        }

        location ~ ^/static/plugins/(.*)$ {
            deny all;
        }
    }

    location / {
        alias /home/forge/staging.app.erpspace.pl/packages/core//app/dist/client/;
        try_files $uri $uri/ /index.html;
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Pragma 'no-cache';
        add_header Expires 0;
        if_modified_since off;
        expires off;
        etag off;
        
        location ~* \.(js|css)$ {
            expires 365d;
            add_header Cache-Control "public";
        }
    }
    
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:13004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        add_header Cache-Control 'no-cache, no-store';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location /ws {
        proxy_pass http://127.0.0.1:13004/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/staging.app.erpspace.pl-error.log error;
    
    error_page 404 /index.html;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/staging.app.erpspace.pl/after/*;
